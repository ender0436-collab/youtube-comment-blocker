<body>

    <h1>プライバシーポリシー</h1>

    <p>
        YouTube Comment Blocker は、
        個人情報の収集、送信、保存、共有を行いません。
    </p>

    <p>
        ブロックユーザー、NGワード、
        ダークモード設定などの情報は、
        Chrome Sync Storage のみを利用して保存されます。
    </p>

    <p>
        ユーザーデータが外部サーバーへ送信されることはありません。
    </p>

    <p>
        本拡張機能は YouTube および Google と
        提携・承認・運営関係にはありません。
    </p>
