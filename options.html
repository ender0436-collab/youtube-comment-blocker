<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>YouTube Comment Blocker</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>

    <div class="container">

        <header class="header">

            <div>
                <h1>YouTube Comment Blocker</h1>

                <p class="subtitle">
                    ユーザーとNGワードを管理します
                </p>
            </div>

            <div class="theme-toggle">

                <span class="theme-label">
                    🌙 ダークモード
                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="darkMode">

                    <span class="slider"></span>

                </label>

            </div>

        </header>

        <section class="card">

            <div class="section-header">

                <h2>🚫 ブロックユーザー</h2>

                <span
                    id="userCount"
                    class="count-badge">
                    0
                </span>

            </div>

            <div class="input-row">

                <input
                    id="userInput"
                    type="text"
                    placeholder="@ユーザー名">

                <button id="addUser">
                    追加
                </button>

            </div>

            <ul id="userList"></ul>

        </section>

        <section class="card">

            <div class="section-header">

                <h2>📝 NGワード</h2>

                <span
                    id="wordCount"
                    class="count-badge">
                    0
                </span>

            </div>

            <div class="input-row">

                <input
                    id="wordInput"
                    type="text"
                    placeholder="NGワード">

                <button id="addWord">
                    追加
                </button>

            </div>

            <ul id="wordList"></ul>

        </section>

        <section class="card">

            <div class="section-header">
                <h2>📁 データ管理</h2>
            </div>

            <div class="input-row">

                <button id="exportCsv">
                    CSVエクスポート
                </button>

                <button id="importCsvButton">
                    CSVインポート
                </button>

                <input
                    id="importCsv"
                    type="file"
                    accept=".csv"
                    hidden>

            </div>

        </section>

    </div>

    <script src="options.js"></script>

</body>

</html>
