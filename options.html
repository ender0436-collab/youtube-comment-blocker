<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>YouTube Comment Blocker</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>

    <div class="container">

        <header class="header">

            <div>
                <h1>YouTube Comment Blocker</h1>

                <p class="subtitle">
                    ユーザーとNGワードを管理します
                </p>
            </div>

        </header>

        <div class="tabs">

            <button
                class="tab-button active"
                data-tab="users">

                ユーザー名

            </button>

            <button
                class="tab-button"
                data-tab="words">

                NGワード

            </button>

            <button
                class="tab-button"
                data-tab="settings">

                設定

            </button>

        </div>

        <!-- ユーザータブ -->

        <div
            id="users"
            class="tab-content active">

            <section class="card">

                <div class="section-header">

                    <h2>🚫 ブロックユーザー</h2>

                    <span
                        id="userCount"
                        class="count-badge">

                        0

                    </span>

                </div>

                <div class="input-row">

                    <input
                        id="userInput"
                        type="text"
                        placeholder="@ユーザー名">

                    <button id="addUser">
                        追加
                    </button>

                </div>

                <ul id="userList"></ul>

            </section>

        </div>

        <!-- NGワードタブ -->

        <div
            id="words"
            class="tab-content">

            <section class="card">

                <div class="section-header">

                    <h2>📝 NGワード</h2>

                    <span
                        id="wordCount"
                        class="count-badge">

                        0

                    </span>

                </div>

                <div class="input-row">

                    <input
                        id="wordInput"
                        type="text"
                        placeholder="NGワード">

                    <button id="addWord">
                        追加
                    </button>

                </div>

                <ul id="wordList"></ul>

            </section>

        </div>

        <!-- 設定タブ -->

        <div
            id="settings"
            class="tab-content">

            <!-- ダークモード -->

            <section class="card">

                <div class="section-header">
                    <h2>🌙 ダークモード</h2>
                </div>

                <div class="theme-toggle">

                    <span class="theme-label">
                        ダークモード
                    </span>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="darkMode">

                        <span class="slider"></span>

                    </label>

                </div>

            </section>

            <!-- CSV -->

            <section class="card">

                <div class="section-header">
                    <h2>📁 データ管理</h2>
                </div>

                <div class="input-row">

                    <button id="exportCsv">
                        CSVエクスポート
                    </button>

                    <button id="importCsvButton">
                        CSVインポート
                    </button>

                    <input
                        id="importCsv"
                        type="file"
                        accept=".csv"
                        hidden>

                </div>

            </section>

            <!-- リンク -->

            <section class="card">

                <div class="section-header">
                    <h2>🔗 リンク</h2>
                </div>

                <div class="settings-actions">

                    <a
                        class="settings-link"
                        href="https://github.com/ender0436-collab/youtube-comment-blocker"
                        target="_blank"
                        rel="noopener noreferrer">

                        <svg
                            class="github-icon"
                            viewBox="0 0 16 16"
                            aria-hidden="true">

                            <path
                                fill="currentColor"
                                d="M8 0C3.58 0 0 3.58 0 8a8.01 8.01 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.52 7.52 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z">
                            </path>

                        </svg>

                        GitHub リポジトリ

                    </a>

                    https://github.com/sponsors/ender0436-collab

                        ❤️

                        GitHub Sponsors

                    </a>

                    <a
                        class="settings-link"
                        href="https://buymeacoffee.com/ender0436"
                        target="_blank"
                        rel="noopener noreferrer">

                        ☕

                        Buy Me a Coffee

                    </a>

                </div>

            </section>

        </div>

    </div>

    <script src="options.js"></script>

</body>

</html>
